name: Unit Tests

on:
  pull_requestt:
    branches:
      - master

jobs:
  tests:
    runs-on: ubuntu-latest

    steps:
      - name: Clonar 
        run: |
          git clone https://github.com/${{github.repository}}

      - name: Install Node.js
        run: |
          curl -fsSL https://deb.nodesource.com/setup_20.x |
          sudo apt-get install -y nodejs

      - name: Install Dependencies
        run: npm install
      
      - name: Run Tests
        run: npm test

    